name: Lines of code

on:
  schedule:
    - cron: "0 0 * * *"   # once a day (05:30 IST)
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  lines-of-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the card back to this repo
    steps:
      - uses: actions/checkout@v4

      - name: Count lines and draw the card
        run: python3 .github/scripts/loc_card.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: UtkarshCodecom
          OUTPUT: metrics.plugin.lines.svg        # the file your README already points to
          CACHE: .github/loc-stats.json
          # Comma-separated repo names to leave out, e.g. ones full of generated code
          SKIP_REPOS: ""

      - name: Commit the card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.plugin.lines.svg .github/loc-stats.json
          if git diff --cached --quiet; then
            echo "Card unchanged"
          else
            git commit -m "Update lines-of-code card"
            git push
          fi
