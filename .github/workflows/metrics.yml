name: Lines of code

on:
  schedule:
    - cron: "0 0 * * *"   # once a day (05:30 IST)
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  lines-of-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed so the action can commit the SVG back to this repo
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UtkarshCodecom
          filename: metrics.plugin.lines.svg
          template: classic
          config_timezone: Asia/Calcutta

          # Total lines added / removed across your repositories
          base: repositories
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30   # GitHub's stats API can return stale numbers on the first call

          # Optional: exclude repos full of generated/vendored code so they don't inflate the count
          # plugin_lines_skipped: |
          #   some-repo-name
