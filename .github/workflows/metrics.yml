name: Lines of code

on:
  schedule:
    - cron: "0 0 * * *"   # once a day (05:30 IST)
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  lines-of-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed so the action can commit the SVG back to this repo
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: UtkarshCodecom
          filename: metrics.plugin.lines.svg
          template: classic
          config_timezone: Asia/Calcutta

          # Total lines added / removed across your repositories
          base: repositories
          plugin_lines: yes
          # Only "base": the history/repositories templates crash the whole run if the
          # plugin hits any error, while "base" shows the error inside the card instead.
          plugin_lines_sections: base
          plugin_lines_delay: 30   # GitHub's stats API can return stale numbers on the first call

          # Fail fast instead of retrying 3x with 5-minute waits (that's why it took ~18 min)
          retries: 1

          # Work around upstream null-author contributor stats crash by scoping to this repository.
          plugin_lines_skipped: |
            @use.patterns
            */*
            +UtkarshCodecom/UtkarshCodecom
